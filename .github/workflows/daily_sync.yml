name: Daily Sync Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas thefuzz python-Levenshtein
      - name: Run Pipeline
        run: |
          python scraper.py
          python crm_client.py
          python matcher.py